name: switchml

topology:
  nodes:
    proxy:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.200
      binds:
        - ~/myrepo/verinc-switchml:/root/switchml
      cmd: sleep infinity
      exec:
        - bash -c "nohup python3 -u /root/switchml/proxy.py &> /root/switchml/log/proxy.log &"

    tofino:
      kind: linux
      image: switchml-tofino:latest
      mgmt-ipv4: 172.20.20.100
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-switchml:/root/bty/switchml
      cmd: |
          bash -ic "
          mkdir -p /tmp
          sed -i 's/is not 0/!= 0/g' $SDE_INSTALL/lib/python3.5/site-packages/tofino/bfrt_grpc/client.py
          cd /root/bty/switchml
          cat set-tofino-env.sh >> /root/.bashrc
          source /root/.bashrc
          cp sitecustomize_.py $SDE_INSTALL/lib/python3.8/site-packages/sitecustomize.py
          cp dev_root/p4-build/SwitchML.conf $SDE_INSTALL/share/p4/targets/tofino
          rm model*.log bf_drivers.log*
          rm $SDE_INSTALL/lib/libpltfm_mgr.so
          $SDE/run_tofino_model.sh -f ports.json -p SwitchML &> log/tofino_model.log &
          sleep 3
          $SDE/run_switchd.sh -p SwitchML &> log/switchd.log &
          sleep 18
          cd dev_root/controller
          python3.8 switchml.py --bfrt-ip 172.20.20.100 --switch-ip 10.0.0.100 --log-level DEBUG &> ../../log/controller.log
          sleep infinity
          "
      exec:
        - sleep 33

    worker1:
      kind: linux
      image: switchml-client:v2
      mgmt-ipv4: 172.20.20.11
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-switchml:/home/bty/switchml
      cmd: bash -i -c "cat /home/bty/switchml/set-client-env.sh >> /root/.bashrc && sleep infinity"
      exec:
        - hostname worker1
        - ip link set dev veth address 00:11:22:33:44:55 # Containerlab: docker run -> veth pairs -> docker exec.
        - sleep 35
        - bash -ic "cd $PROJ_DIR/dev_root/build/bin && ./hello_world &> $PROJ_DIR/log/violation_worker1.log"

    worker2:
      kind: linux
      image: switchml-client:v2
      mgmt-ipv4: 172.20.20.12
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-switchml:/home/bty/switchml
      cmd: bash -i -c "cat /home/bty/switchml/set-client-env.sh >> /root/.bashrc && sleep infinity"
      exec:
        - hostname worker2
        - ip link set dev veth address 00:11:22:33:44:66
        - sleep 35
        - bash -ic 'cd $PROJ_DIR/dev_root/build/bin && ./hello_world &> $PROJ_DIR/log/violation_worker2.log'

  links:
    - endpoints: ["worker1:veth", "proxy:veth-worker1"]
    - endpoints: ["worker2:veth", "proxy:veth-worker2"]
    - endpoints: ["tofino:veth0", "proxy:veth-tofino0"]
    - endpoints: ["tofino:veth4", "proxy:veth-tofino4"]
    - endpoints: ["tofino:veth68", "proxy:veth-tofino68"]
