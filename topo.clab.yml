name: netlock

topology:
  nodes:
    proxy:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.200
      binds:
        - ~/myrepo/verinc-netlock:/root/netlock
      cmd: sleep infinity
      exec:
        - bash -c "nohup python3 -u /root/netlock/proxy.py &> /root/netlock/log/proxy.log &"

    tofino:
      kind: linux
      image: tofino:20251025
      mgmt-ipv4: 172.20.20.100
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-netlock:/root/abc/netlock
      cmd: |
          bash -ic "
          mkdir -p /tmp /run/sshd
          service ssh start
          cd /root/abc/netlock
          cp netlock-p4-build/netlock.conf $SDE_INSTALL/share/p4/targets/tofino
          rm $SDE_INSTALL/lib/libpltfm_mgr.so
          rm /root/abc/netlock/model*.log /root/abc/netlock/bf_drivers.log*
          sleep 5
          $SDE/run_tofino_model.sh -f ports.json -p netlock &> log/tofino_model.log &
          sleep 3
          bash switch/run_lockmgr.sh -p netlock
          "
      exec:
        - bash -ic "cd /root/abc/netlock && $SDE/run_p4_tests.sh -f `pwd`/ports.json -p netlock -t `pwd`/baseline/NetLock/switch/control --test-params=\"bm='micro'\""

    worker1:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.11
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-netlock:/home/abc/netlock
      cmd: sleep infinity
      exec:
        - bash /home/abc/netlock/worker_exec.sh
        - sleep 35
        - bash -c "cd /home/abc/netlock/experiments && source set-env.sh && ./evaluation.sh netlock violation 0 1"

    worker2:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.12
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-netlock:/home/abc/netlock
      cmd: sleep infinity
      exec:
        - bash /home/abc/netlock/worker_exec.sh

    worker3:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.13
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-netlock:/home/abc/netlock
      cmd: sleep infinity
      exec:
        - bash /home/abc/netlock/worker_exec.sh

    worker4:
      kind: linux
      image: dpdk:v21.11.4
      mgmt-ipv4: 172.20.20.14
      binds:
        - /dev/hugepages:/mnt/huge
        - ~/myrepo/verinc-netlock:/home/abc/netlock
      cmd: sleep infinity
      exec:
        - bash /home/abc/netlock/worker_exec.sh

  links:
    - endpoints: ["worker1:veth", "proxy:veth-worker1"]
    - endpoints: ["worker2:veth", "proxy:veth-worker2"]
    - endpoints: ["worker3:veth", "proxy:veth-worker3"]
    - endpoints: ["worker4:veth", "proxy:veth-worker4"]
    - endpoints: ["tofino:veth128", "proxy:veth-tofino128"]
    - endpoints: ["tofino:veth144", "proxy:veth-tofino144"]
    - endpoints: ["tofino:veth160", "proxy:veth-tofino160"]
    - endpoints: ["tofino:veth176", "proxy:veth-tofino176"]
    - endpoints: ["tofino:veth188", "proxy:veth-tofino188"] # Loopback port.
